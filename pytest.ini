[pytest]

addopts =
    -v
    --tb=short
    --disable-warnings
    --show-capture=no
    
    --html=reports/report.html
    --self-contained-html

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

markers =
    ui: UI tests
    api: API tests
    e2e: End-to-end tests
    performance: Performance tests
    flaky: unstable tests with rerun support

log_cli = false

xfail_strict = true

filterwarnings =
    ignore::DeprecationWarning