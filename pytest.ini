[pytest]

addopts =
    -v
    --reruns 2
    --reruns-delay 2
    --html=reports/report.html
    --self-contained-html

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

markers =
    ui: UI tests
    api: API tests
    e2e: End-to-end tests
    performance: Performance tests

log_cli = true

log_cli_level = INFO

log_cli_format =
    %(asctime)s [%(levelname)s] %(message)s

xfail_strict = true

filterwarnings =
    ignore::DeprecationWarning