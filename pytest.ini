[pytest]

addopts =
    -v
    -rA
    --tb=short
    --disable-warnings
    --show-capture=no
    --reruns 2
    --reruns-delay 2
    --html=reports/report.html
    --self-contained-html

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

markers =
    ui: UI tests
    api: API tests
    e2e: End-to-end tests
    performance: Performance tests

log_cli = false

xfail_strict = true

filterwarnings =
    ignore::DeprecationWarning